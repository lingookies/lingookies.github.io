<style>
        /* Global Reset and Typography */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: #1a1a1a;
            line-height: 1.6;
            background-color: #FDF3DA; /* Base color for the bottom of the page */
        }
        
        img { max-width: 100%; height: auto; display: block; }
        
        /* Standard Container (Reverted to original width) */
        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 0 2rem;
        }

        /* ONLY FIX: Make the hero section wider across the viewport */
        .hero-section .container {
            max-width: 85%; 
        }

        /* Wide Container (Specifically for the Logic Section) */
        .container-wide {
            max-width: 90%;
            margin: 0 auto;
            padding: 0 2rem;
        }

        /* Typography (Kept the larger, punchy sizes) */
        h1, h2, h3 { font-weight: 800; letter-spacing: -0.03em; line-height: 1.2; }
        p { font-size: 1.15rem; margin-bottom: 1.5rem; color: #333; }
        .text-center { text-align: center; }

        /* App Store Badges */
        .badges { display: flex; gap: 1rem; flex-wrap: wrap; }
        .badges img { height: 55px; width: auto; transition: transform 0.2s; }
        .badges a:hover img { transform: scale(1.05); }

        /* --- Sections & Gradients --- */
        
        /* 1. Hero Section (FDF3DA to 4CB8B8) */
        .hero-section {
            background-image: linear-gradient(180deg, #FDF3DA 0%, #4CB8B8 100%);
            min-height: 100vh; /* Forces section to occupy 100% of viewport height, fixing zoom issues */
            display: flex; /* Centers content vertically */
            align-items: center;
            padding: 4rem 0; 
        }
        .hero-grid {
            display: grid;
            grid-template-columns: 1fr 1fr; 
            gap: 4rem;
            align-items: center;
            width: 100%;
        }
        .hero-text h1 { font-size: 3.5rem; margin-bottom: 1.5rem; }
        .hero-text ul {
            list-style-type: none;
            margin-bottom: 2.5rem;
            font-size: 1.3rem;
            font-weight: 600;
        }
        .hero-text li { margin-bottom: 0.75rem; display: flex; align-items: center; gap: 0.5rem; }
        .hero-text li::before { content: "✓"; color: #0f5132; font-weight: bold; }
        .hero-image img { border-radius: 20px; max-height: 75vh; margin: 0 auto; }

        /* 2. Philosophy Section (4CB8B8 to FDF3DA) */
        .philosophy-section {
            background-image: linear-gradient(180deg, #4CB8B8 0%, #FDF3DA 100%);
            padding: 8rem 0;
            min-height: 60vh;
            display: flex;
            align-items: center;
        }
        .philosophy-content {
            text-align: center;
        }
        .philosophy-content h2 { font-size: 3rem; margin-bottom: 1.5rem; color: #111; }
        .philosophy-content p { font-size: 1.4rem; font-weight: 500; }

        /* 3. The Secret / Logic Section (Using wide container) */
        .logic-section { padding: 6rem 0; }
        .logic-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 5rem;
            align-items: center;
        }
        .logic-text h2 { font-size: 2.5rem; margin-bottom: 1.5rem; }
        .logic-box {
            background: white;
            padding: 2.5rem;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            margin-top: 2rem;
        }
        .logic-box h3 { font-size: 1.6rem; margin-bottom: 1.5rem; border-bottom: 2px solid #eee; padding-bottom: 1rem;}
        .logic-box p { font-size: 1.2rem; margin-bottom: 1rem; }
        .logic-images { display: grid; grid-template-columns: 1fr 1fr; gap: 2rem; }
        .framed-mockup { border-radius: 30px; box-shadow: 0 20px 40px rgba(0,0,0,0.15); }

        /* 4. Features Section (Back to standard container) */
        .features-section { padding: 6rem 0; background-color: white; border-radius: 40px; margin: 0 2rem; }
        .features-header { text-align: center; max-width: 900px; margin: 0 auto 5rem auto; }
        .features-header h2 { font-size: 3rem; margin-bottom: 1rem; }
        .features-header p { font-size: 1.3rem; }
        
        .feature-row {
            margin-left: auto; 
            margin-right: auto; 
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
            align-items: center;
            margin-bottom: 4rem;
            padding: 0 2rem;
        }
        .feature-row:nth-child(even) .feature-text { order: 2; }
        .feature-row:nth-child(even) .feature-visual { order: 1; }
        
        .feature-text h3 { font-size: 2rem; margin-bottom: 1rem; display: flex; align-items: center; gap: 0.5rem; }
        .feature-text p { font-size: 1.2rem; }
        .feature-visual { display: flex; justify-content: center; gap: 1rem; position: relative; }
        .feature-visual img { max-height: 550px; object-fit: contain; }

        /* 5. CTA Section */
        .cta-section { padding: 8rem 0; text-align: center; }
        .cta-section h2 { font-size: 3.5rem; margin-bottom: 1.5rem; max-width: 1000px; margin-left: auto; margin-right: auto; }
        .cta-section p { font-size: 1.4rem; max-width: 800px; margin: 0 auto; }
        .cta-section .badges { justify-content: center; margin-top: 3rem; }

        /* Footer */
        .legal-footer { text-align: center; padding: 3rem 2rem; font-size: 0.85rem; color: #666; }

        /* Responsive Design */
        @media (max-width: 1024px) {
            .hero-grid, .logic-grid, .feature-row { grid-template-columns: 1fr; gap: 4rem; text-align: center; }
            .feature-row { padding: 0 1rem; }
            .feature-row:nth-child(even) .feature-text { order: 1; }
            .feature-row:nth-child(even) .feature-visual { order: 2; }
            .hero-text h1 { font-size: 2.8rem; }
            .badges { justify-content: center; }
            .hero-text ul { display: inline-block; text-align: left; }
            .hero-section { min-height: auto; padding: 6rem 0; }
        }
    </style>
